services:
  - type: web
    name: lanora-market-analysis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 web_server.py
    envVars:
      - key: PORT
        value: 10000
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
