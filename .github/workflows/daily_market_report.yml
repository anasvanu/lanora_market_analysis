name: Lanora Gold Daily Technical Report Automation

on:
  schedule:
    # Primary: 04:00 UTC = 08:00 AM GST (Gulf Standard Time, GMT+4)
    - cron: '0 4 * * 1-5'
    # Backup: 05:00 UTC = 09:00 AM GST — in case primary slot is delayed by GitHub
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

# Prevent duplicate runs if both cron slots fire at once
concurrency:
  group: daily-report-${{ github.ref }}-${{ github.run_date || github.sha }}
  cancel-in-progress: false

jobs:
  generate_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Current GST Time
        run: |
          python3 -c "
          from datetime import datetime, timezone, timedelta
          gst = datetime.now(timezone(timedelta(hours=4)))
          print(f'Current GST Time: {gst.strftime(\"%Y-%m-%d %H:%M:%S\")} (GMT+4)')
          print(f'Day of week: {gst.strftime(\"%A\")}')
          "

      - name: Execute Daily Morning Market Research & Report Generation
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          python scheduler.py

      - name: Upload Report PDF as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lanora-Gold-Report-${{ github.run_number }}
          path: "*.pdf"
          retention-days: 30
          if-no-files-found: warn
